<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>شكراً على طلبك | OFFRE BAC</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b1429,#172747);font-family:Tahoma,Arial,sans-serif;color:#15213b}.card{width:min(100%,560px);padding:36px 24px;background:#fff;border-radius:26px;text-align:center;line-height:1.9;box-shadow:0 25px 80px #0004}.check{font-size:52px;color:#4268f5}h1{font-size:28px}.price{font-size:38px;color:#3152d9}.price del{font-size:22px;color:#68748b}.button{display:block;margin:14px 0;background:#4268f5;color:#fff;border-radius:12px;padding:12px;text-decoration:none}[hidden]{display:none!important}</style></head><body><main class="card"><div id="check" class="check" aria-hidden="true" hidden>✓</div><h1 id="title">عرض OFFRE BAC</h1><p id="intro">املأ استمارة التسجيل في الموقع لإرسال طلبك.</p><div class="price"><del>799 DH</del> <strong>499 DH</strong></div><p id="notice" hidden>تم استلام طلب التسجيل، ولا تحتاج إلى أي تأكيد إضافي. هذا التأكيد لا يعني إتمام الدفع.</p><a class="button" href="index.html">العودة إلى الموقع</a></main><script>(()=>{'use strict';let submitted=false;try{submitted=sessionStorage.getItem('offre_bac_submitted')==='1';}catch(_){}if(submitted){document.getElementById('check').hidden=false;document.getElementById('title').textContent='شكراً، تم استلام طلبك بنجاح!';document.getElementById('intro').textContent='تم حفظ معلوماتك وإرسال طلب التسجيل بنجاح.';document.getElementById('notice').hidden=false;}})();</script></body></html>
