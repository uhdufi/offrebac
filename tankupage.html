<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>شكراً على طلبك | OFFRE BAC</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b1429,#172747);font-family:Tahoma,Arial,sans-serif;color:#15213b}.card{width:min(100%,560px);padding:36px 24px;background:#fff;border-radius:26px;text-align:center;line-height:1.9;box-shadow:0 25px 80px #0004}.check{font-size:52px;color:#4268f5}h1{font-size:28px}.price{font-size:38px;color:#3152d9}.price del{font-size:22px;color:#68748b}a{display:block;margin:14px 0;color:#3152d9}.button{background:#4268f5;color:#fff;border-radius:12px;padding:12px;text-decoration:none}.error{color:#a12b35} [hidden]{display:none!important}</style></head><body><main class="card"><div class="check" aria-hidden="true">✓</div><h1 id="title">تم تجهيز طلبك!</h1><p id="intro">بقي تأكيد إرسال معلوماتك عبر واتساب لإكمال التسجيل.</p><div class="price"><del>799 DH</del> <strong>499 DH</strong></div><p id="notice">سيتم فتح واتساب خلال ثانية واحدة. اضغط على «إرسال» داخل واتساب لإتمام الطلب.</p><a id="whatsappButton" class="button" hidden>فتح واتساب الآن</a><p id="dataError" class="error" role="alert" hidden></p><a href="index.html">العودة إلى الموقع</a></main><script>(()=>{'use strict';const expiry=Date.parse('2026-11-06T14:59:02.086449+00:00');const p=new URLSearchParams(location.search);const name=(p.get('fullName')||'').trim(),phone=(p.get('phone')||'').trim(),branch=(p.get('branch')||'').trim(),level=(p.get('level')||'الثانية باكالوريا').trim();function normalize(v){let n=v.replace(/[٠-٩۰-۹]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.includes(d)?'٠١٢٣٤٥٦٧٨٩'.indexOf(d):'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[\s().-]/g,'');if(n.startsWith('00'))n='+'+n.slice(2);if(/^0[5-7][0-9]{8}$/.test(n))n='+212'+n.slice(1);else if(/^[5-7][0-9]{8}$/.test(n))n='+212'+n;else if(/^212[5-7][0-9]{8}$/.test(n))n='+'+n;return /^\+[1-9][0-9]{7,14}$/.test(n)?n:'';}const button=document.getElementById('whatsappButton');function error(text){document.getElementById('title').textContent='تعذّر إكمال الطلب';document.getElementById('intro').hidden=true;document.getElementById('notice').hidden=true;const box=document.getElementById('dataError');box.textContent=text;box.hidden=false;}if(Date.now()>=expiry){error('انتهى العرض الخاص. تواصل معنا لمعرفة العروض المتاحة.');return;}if(name.length<3||!normalize(phone)||!['العلوم الفيزيائية','علوم الحياة والأرض','STE','STM','BAC LIBRE','BP'].includes(branch)){error('لم نعثر على بيانات تسجيل صحيحة. ارجع إلى الموقع وأعد تعبئة الاستمارة.');return;}const message='السلام عليكم، أريد التسجيل في عرض OFFRE BAC.\n\nالاسم الكامل: '+name+'\nرقم الهاتف: '+phone+'\nالشعبة: '+branch+'\nالمستوى الدراسي: '+level+'\nالعرض: خمس مواد - 499 DH\n\nشكراً لكم.';const url='https://wa.me/212663271459?text='+encodeURIComponent(message);button.href=url;button.hidden=false;const timer=setTimeout(()=>location.assign(url),1000);button.addEventListener('click',()=>clearTimeout(timer));})();</script></body></html>
